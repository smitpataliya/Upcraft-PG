# Isolated unit/Web/JPA test profile (H2 MySQL mode — does NOT substitute for MySQL Flyway testing)
spring.datasource.url=jdbc:h2:mem:upcraft_pg_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Test-only Base64 signing key for JUnit execution
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy0xMjM0NTY3ODkwMTIzNDU2Nzg5MA==
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.rate-limit.auth-requests-per-minute=100
app.storage.local-base-dir=target/test-uploads

